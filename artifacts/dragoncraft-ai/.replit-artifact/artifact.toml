kind = "web"
previewPath = "/"
title = "DragonCraft AI"
description = "A cyber-anime creative studio where founders forge brand identities, landing pages, and conversion-ready digital experiences with AI-powered dragon realms."
version = "1.0.0"
id = "artifacts/dragoncraft-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20304

[services.development]
run = "pnpm --filter @workspace/dragoncraft-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dragoncraft-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/dragoncraft-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20304"
BASE_PATH = "/"
